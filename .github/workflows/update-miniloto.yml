name: Update Miniloto Results

on:
  schedule:
    # MiniLoto draw is Tuesday evening Japan time.
    # GitHub Actions cron uses UTC.
    - cron: "40 11 * * 2"  # Tue 20:40 JST
    - cron: "0 13 * * 2"   # Tue 22:00 JST retry
    - cron: "10 0 * * 3"   # Wed 09:10 JST fallback retry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-miniloto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update MiniLoto data
        env:
          BACKUP_MINILOTO_URL: ${{ secrets.BACKUP_MINILOTO_URL }}
        run: |
          python scripts/update_miniloto.py

      - name: Commit updated data
        run: |
          git config user.name "miniloto-analysis-bot"
          git config user.email "miniloto-bot@example.com"
          git add data/results.json data/results.csv data/last_updated.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update MiniLoto results data"
            git push
          fi
